name: flyrank-capstone-imagerelevance
track: backend
capstone: AI Image Understanding & Content Matching Engine

run: pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000
seed: python scripts/seed.py
test: pytest

base_url: http://localhost:8000

endpoints:
  - GET /health
  - POST /images/batch-process
  - GET /jobs/{id}
  - GET /images
  - GET /images/{id}
  - POST /posts
  - GET /posts
  - GET /posts/{id}/images
  - GET /posts/{id}/check/{image_id}
  - GET /suggestions
  - GET /suggestions/{id}
  - POST /suggestions/{id}/review
